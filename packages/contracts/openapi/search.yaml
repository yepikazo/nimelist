openapi: 3.1.0
info:
  title: Nimelist Search Service
  version: 1.0.0
servers:
  - url: http://search:4103
paths:
  /v1/search:
    get:
      operationId: searchMedia
      summary: Cari anime di indeks Nimelist.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
        - name: cursor
          in: query
          schema: { type: [string, "null"] }
      responses:
        "200":
          description: Hasil pencarian.
          content:
            application/json:
              schema:
                type: object
                required: [query, items, hasMore]
                properties:
                  query: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
                  nextCursor: { type: [string, "null"] }
                  hasMore: { type: boolean }
                  tookMs: { type: integer, minimum: 0 }
        "400":
          description: Query tidak valid.
  /internal/v1/documents:
    post:
      operationId: upsertSearchDocuments
      summary: Perbarui proyeksi Search dari event Catalog.
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/SearchDocument" }
      responses:
        "202": { description: Dokumen diterima dan disimpan ke proyeksi Search. }
        "400": { description: Dokumen tidak valid. }
        "401": { description: Token service tidak valid. }
  /internal/v1/reindex:
    post:
      operationId: rebuildSearchProjection
      summary: Bangun ulang proyeksi dari internal Catalog API.
      security: [{ serviceToken: [] }]
      responses:
        "200": { description: Proyeksi berhasil dibangun ulang. }
        "401": { description: Token service tidak valid. }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  schemas:
    SearchDocument:
      type: object
      required: [mediaId, slug, titleRomaji]
      properties:
        mediaId: { type: string, format: uuid }
        slug: { type: string }
        titleRomaji: { type: string }
        titleEnglish: { type: [string, "null"] }
        titleNative: { type: [string, "null"] }
        titleId: { type: [string, "null"] }
        synonyms: { type: array, items: { type: string } }
        genres: { type: array, items: { type: string } }
        studios: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        isAdult: { type: boolean }
    SearchHit:
      type: object
      required: [mediaId, slug, title, score]
      properties:
        mediaId: { type: string }
        slug: { type: string }
        title: { type: string }
        titleRomaji: { type: string }
        titleEnglish: { type: [string, "null"] }
        coverUrl: { type: [string, "null"], format: uri }
        score: { type: number, minimum: 0 }
