openapi: 3.1.0
info:
  title: Nimelist Catalog Service
  version: 1.0.0
servers:
  - url: http://catalog:4101
paths:
  /v1/taxonomy:
    get:
      operationId: getCatalogTaxonomy
      summary: Ambil genre, studio, platform, dan musim untuk filter katalog.
      responses:
        "200":
          description: Opsi filter beserta jumlah media publik.
          content:
            application/json:
              schema:
                type: object
                required: [genres, studios, platforms, seasons]
                properties:
                  genres: { type: array, items: { type: object } }
                  studios: { type: array, items: { type: object } }
                  platforms: { type: array, items: { type: object } }
                  seasons: { type: array, items: { type: object } }
  /v1/media:
    get:
      operationId: listMedia
      summary: Cari dan filter katalog media.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: genre
          in: query
          schema: { type: string }
        - name: season
          in: query
          schema: { type: string, enum: [WINTER, SPRING, SUMMER, FALL] }
        - name: year
          in: query
          schema: { type: integer, minimum: 1900, maximum: 2100 }
        - name: status
          in: query
          schema: { type: string, enum: [FINISHED, RELEASING, NOT_YET_RELEASED, CANCELLED, HIATUS, UNKNOWN] }
        - name: format
          in: query
          schema: { type: string, enum: [TV, TV_SHORT, MOVIE, SPECIAL, OVA, ONA, MUSIC, UNKNOWN] }
        - name: platform
          in: query
          schema: { type: string }
        - name: contentStatus
          in: query
          schema: { type: string, enum: [MISSING, DRAFT, REVIEWED, PUBLISHED, REJECTED] }
        - name: sort
          in: query
          schema: { type: string, enum: [populer, skor, judul, terbaru], default: populer }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 60, default: 24 }
      responses:
        "200":
          description: Halaman katalog.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MediaSummary" } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/media/{slug}:
    get:
      operationId: getMediaBySlug
      summary: Ambil detail media berdasarkan slug.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Detail media.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /internal/v1/media/import:
    post:
      operationId: importMedia
      summary: Upsert metadata yang sudah dinormalisasi oleh Ingestion Service.
      security: [{ serviceToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaImport" }
      responses:
        "202":
          description: Import diterima atau sudah diterapkan secara idempoten.
          content:
            application/json:
              schema:
                type: object
                required: [mediaId, status]
                properties:
                  mediaId: { type: string }
                  status: { type: string, enum: [created, updated, unchanged] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /internal/v1/media:
    get:
      operationId: getMediaSummariesById
      summary: Ambil ringkasan media untuk service internal.
      security: [{ serviceToken: [] }]
      parameters:
        - name: ids
          in: query
          required: true
          description: Daftar 1–100 UUID media, dipisahkan koma.
          schema: { type: string }
      responses:
        "200":
          description: Ringkasan media yang tersedia dan tidak dewasa.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InternalMediaSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /internal/v1/search-documents:
    get:
      operationId: listSearchProjectionSourceDocuments
      summary: Ambil dokumen sumber Search dengan pagination.
      security: [{ serviceToken: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: mediaId
          in: query
          description: Jika ada, hanya ambil satu dokumen media dengan UUID tersebut.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dokumen sumber untuk proyeksi Search, termasuk flag adult agar dapat difilter.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextOffset]
                properties:
                  items: { type: array, items: { type: object } }
                  nextOffset: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /internal/v1/taxonomy/import:
    post:
      operationId: importCatalogTaxonomy
      summary: Upsert genre, studio, dan platform untuk seed katalog.
      security: [{ serviceToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxonomyImport" }
      responses:
        "200":
          description: Taxonomy disimpan secara idempoten.
          content:
            application/json:
              schema:
                type: object
                required: [genreCount, studioCount, platformCount]
                properties:
                  genreCount: { type: integer }
                  studioCount: { type: integer }
                  platformCount: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  schemas:
    MediaSummary:
      type: object
      required: [id, slug, title, format, status]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        titleRomaji: { type: string }
        titleEnglish: { type: [string, "null"] }
        titleId: { type: [string, "null"] }
        synopsisId: { type: [string, "null"] }
        format: { type: string }
        status: { type: string }
        season: { type: [string, "null"] }
        seasonYear: { type: [integer, "null"] }
        episodes: { type: [integer, "null"] }
        durationMinutes: { type: [integer, "null"] }
        scoreAvg: { type: [number, "null"] }
        popularity: { type: integer }
        coverUrl: { type: [string, "null"], format: uri }
        isAdult: { type: boolean }
        contentStatus: { type: string }
        genres: { type: array, items: { type: object } }
        studios: { type: array, items: { type: object } }
        platforms: { type: array, items: { type: object } }
    MediaDetail:
      allOf:
        - $ref: "#/components/schemas/MediaSummary"
        - type: object
          properties:
            synopsisId: { type: [string, "null"] }
            titleNative: { type: [string, "null"] }
            synonyms: { type: array, items: { type: string } }
            source: { type: string }
            sourceUrl: { type: [string, "null"], format: uri }
            updatedAt: { type: string, format: date-time }
            genres: { type: array, items: { type: object } }
            studios: { type: array, items: { type: object } }
            platforms: { type: array, items: { type: object } }
            platformLinks:
              type: array
              items:
                type: object
                required: [platformSlug, platformName, url, status]
                properties:
                  platformSlug: { type: string }
                  platformName: { type: string }
                  url: { type: string, format: uri }
                  regionCode: { type: string, default: ID }
                  language: { type: string }
                  accessType: { type: string }
                  status: { type: string, enum: [ACTIVE, STALE, BROKEN, REMOVED, SEARCH_ONLY] }
                  notes: { type: [string, "null"] }
    InternalMediaSummary:
      type: object
      required: [id, slug, title, titleRomaji]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        titleRomaji: { type: string }
        titleEnglish: { type: [string, "null"] }
        coverUrl: { type: [string, "null"], format: uri }
    MediaImport:
      type: object
      required: [provider, externalId, titleRomaji]
      properties:
        provider: { type: string, enum: [offline-db, manual, mal, anilist, jikan-self-hosted] }
        externalId: { type: string, minLength: 1, maxLength: 100 }
        sourceUrl: { type: [string, "null"], format: uri }
        titleRomaji: { type: string, minLength: 1, maxLength: 300 }
        titleEnglish: { type: [string, "null"], maxLength: 300 }
        titleNative: { type: [string, "null"], maxLength: 300 }
        titleId: { type: [string, "null"], maxLength: 300 }
        slug: { type: [string, "null"], pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 160 }
        synopsisId: { type: [string, "null"], maxLength: 12000, description: Sinopsis orisinal Indonesia yang telah ditinjau; bukan salinan dari provider. }
        format: { type: [string, "null"], enum: [TV, TV_SHORT, MOVIE, SPECIAL, OVA, ONA, MUSIC, UNKNOWN, null] }
        status: { type: [string, "null"], enum: [FINISHED, RELEASING, NOT_YET_RELEASED, CANCELLED, HIATUS, UNKNOWN, null] }
        season: { type: [string, "null"], enum: [WINTER, SPRING, SUMMER, FALL, null] }
        seasonYear: { type: [integer, "null"], minimum: 1900, maximum: 2100 }
        episodes: { type: [integer, "null"], minimum: 0 }
        durationMinutes: { type: [integer, "null"], minimum: 0 }
        scoreAvg: { type: [number, "null"], minimum: 0, maximum: 10 }
        popularity: { type: [integer, "null"], minimum: 0 }
        coverUrl: { type: [string, "null"], format: uri }
        bannerUrl: { type: [string, "null"], format: uri }
        synonyms: { type: array, items: { type: string, maxLength: 300 } }
        genres: { type: array, items: { type: string, maxLength: 100 } }
        studios: { type: array, items: { type: string, maxLength: 160 } }
        isAdult: { type: [boolean, "null"] }
        contentStatus: { type: string, enum: [MISSING, DRAFT, REVIEWED, PUBLISHED, REJECTED] }
        curatedFields:
          type: array
          items:
            type: string
            enum: [slug, title_id, synopsis_id, format, status, season, season_year, episodes, duration_minutes, score_avg, popularity, cover_url, banner_url, synonyms, genres, studios, is_adult, content_status, platform_links]
        platformLinks:
          type: array
          maxItems: 30
          items:
            type: object
            required: [platformSlug, url]
            properties:
              platformSlug: { type: string }
              url: { type: string, format: uri }
              language: { type: string, enum: [SUB, DUB, SUB_DUB, RAW, UNKNOWN] }
              accessType: { type: string, enum: [FREE, SUBSCRIPTION, RENTAL, PURCHASE, SEARCH, UNKNOWN] }
              status: { type: string, const: SEARCH_ONLY }
              notes: { type: [string, "null"], maxLength: 1000 }
    TaxonomyImport:
      type: object
      properties:
        genres:
          type: array
          maxItems: 100
          items:
            type: object
            required: [slug, name]
            properties:
              slug: { type: string }
              name: { type: string, maxLength: 200 }
              nameId: { type: [string, "null"] }
              description: { type: [string, "null"] }
        studios:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [slug, name]
            properties:
              slug: { type: string }
              name: { type: string, maxLength: 200 }
              nameNative: { type: [string, "null"] }
              websiteUrl: { type: [string, "null"], format: uri }
        platforms:
          type: array
          maxItems: 100
          items:
            type: object
            required: [slug, name, websiteUrl]
            properties:
              slug: { type: string }
              name: { type: string, maxLength: 200 }
              websiteUrl: { type: string, format: uri }
              searchUrlTemplate: { type: [string, "null"] }
              color: { type: [string, "null"] }
              description: { type: [string, "null"] }
              sortOrder: { type: integer, minimum: 0 }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Parameter atau body tidak valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Media tidak ditemukan.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Kredensial service tidak valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
